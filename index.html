<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

<h1>Organigrama EMR</h1>
<div id="chart-container" style="width:100%; height: calc(100vh - 80px);"></div>

<script type="module">
  import * as d3 from "https://esm.sh/d3@7";
  import { OrgChart } from "https://esm.sh/d3-org-chart@3";

  fetch("./team.csv")
    .then(r => r.text())
    .then(text => d3.csvParse(text))
    .then(data => initChart(data));

  function initChart(data) {

    /* =============================
       1. Detectar columnas reales
       ============================= */
    const headers = Object.keys(data[0]);
    const col = {
      name: pick(headers, ["name", "nombre"]),
      role: pick(headers, ["title", "position", "cargo", "role"]),
      supervisor: pick(headers, ["supervisor", "manager", "reports"]),
      image: pick(headers, ["image", "photo", "picture"])
    };

    const ROOT_ID = "__ROOT__";

    /* =============================
       2. Crear nodos base
       ============================= */
    const nodes = data.map((d, i) => ({
      id: `node-${i}`,
      parentId: null,
      name: (d[col.name] || "").trim(),
      role: d[col.role] || "",
      supervisorName: (d[col.supervisor] || "").trim(),
      image: d[col.image] || "",
      level: "personal" // default
    }));

    const byName = new Map(nodes.map(n => [n.name.toLowerCase(), n]));

    /* =============================
       3. Resolver supervisor directo
       ============================= */
    nodes.forEach(n => {
      if (!n.supervisorName) return;
      const sup = byName.get(n.supervisorName.toLowerCase());
      if (sup && sup.id !== n.id) {
        n.parentId = sup.id;
        sup.level = "supervisor";
      }
    });

    /* =============================
       4. Detectar JEFE
       ============================= */
    const jefe = nodes.find(n =>
      !n.supervisorName &&
      nodes.some(x => x.parentId === n.id)
    );

    if (jefe) jefe.level = "jefe";

    /* =============================
       5. ROOT ARTIFICIAL
       ============================= */
    nodes.push({
      id: ROOT_ID,
      parentId: null,
      name: "EMR TEAM",
      role: "",
      image: "",
      level: "root"
    });

    if (jefe) jefe.parentId = ROOT_ID;

    /* =============================
       6. Forzar colgar nodos sueltos
       ============================= */
    nodes.forEach(n => {
      if (!n.parentId && n.level !== "root") {
        n.parentId = jefe ? jefe.id : ROOT_ID;
      }
    });

    /* =============================
       7. Crear OrgChart
       ============================= */
    const chart = new OrgChart()
      .container("#chart-container")
      .data(nodes)
      .nodeWidth(() => 190)
      .nodeHeight(() => 120)
      .childrenMargin(() => 40)
      .nodeContent(d => `
        <div class="org-card">
          ${
            d.data.image
              ? `<img src="${d.data.image}" />`
              : `<div style="width:44px;height:44px;border-radius:50%;background:#cbd5e1;margin:0 auto 6px"></div>`
          }
          <div class="org-name">${d.data.name}</div>
          <div class="org-role">${d.data.role}</div>
        </div>
      `);

    chart.render();

    /* =============================
       8. Estado inicial EXACTO
       ============================= */
    chart.collapseAll();

    // solo ROOT visible
    chart.expand(ROOT_ID);
  }

  function pick(headers, keys) {
    return headers.find(h =>
      keys.some(k => h.toLowerCase().includes(k))
    );
  }
</script>

</body>
</html>
