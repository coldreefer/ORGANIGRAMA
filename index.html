<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Organigrama EMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/gojs/release/go.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f6f8fb;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      color: #0f172a;
    }
    #myDiagramDiv {
      width: 100%;
      height: calc(100vh - 80px);
      background: #f6f8fb;
    }
  </style>
</head>

<body>

<h1>Organigrama EMR</h1>
<div id="myDiagramDiv"></div>

<script>
  const $ = go.GraphObject.make;

  const diagram = $(go.Diagram, "myDiagramDiv", {
    initialContentAlignment: go.Spot.Center,
    layout: $(go.TreeLayout, {
      angle: 90,
      arrangement: go.TreeLayout.ArrangementHorizontal,
      nodeSpacing: 30,
      layerSpacing: 40
    }),
    "undoManager.isEnabled": false
  });

  diagram.nodeTemplate =
    $(go.Node, "Vertical",
      {
        click: (e, node) => {
          diagram.model.setDataProperty(
            node.data,
            "isTreeExpanded",
            !node.isTreeExpanded
          );
        }
      },
      $(go.Panel, "Auto",
        $(go.Shape, "RoundedRectangle",
          { fill: "white", stroke: "#e5e7eb" }
        ),
        $(go.Panel, "Vertical",
          { margin: 10 },
          $(go.TextBlock,
            { font: "bold 13px sans-serif" },
            new go.Binding("text", "name")
          ),
          $(go.TextBlock,
            { font: "12px sans-serif", stroke: "#475569" },
            new go.Binding("text", "role")
          )
        )
      )
    );

  diagram.linkTemplate =
    $(go.Link,
      { routing: go.Link.Orthogonal, corner: 6 },
      $(go.Shape, { stroke: "#cbd5e1" })
    );

  fetch("team.csv")
    .then(r => r.text())
    .then(buildModel);

  function buildModel(csv) {
    const rows = csv.trim().split("\n").map(r => r.split(","));
    const headers = rows.shift().map(h => h.toLowerCase());

    const idx = {
      name: find(headers, ["name", "nombre"]),
      role: find(headers, ["role", "cargo", "title"]),
      supervisor: find(headers, ["supervisor", "manager"])
    };

    const people = rows.map(r => ({
      name: r[idx.name]?.trim(),
      role: r[idx.role]?.trim() || "",
      supervisor: r[idx.supervisor]?.trim() || ""
    })).filter(p => p.name);

    // --- construir mapa de relaciones ---
    const children = {};
    people.forEach(p => {
      if (!children[p.supervisor]) children[p.supervisor] = [];
      children[p.supervisor].push(p.name);
    });

    // --- detectar Team Leader REAL ---
    let leader = people.find(p =>
      (children[p.name] || []).some(
        c => (children[c] || []).length > 0
      )
    );

    if (!leader) {
      alert("No se pudo detectar Team Leader automáticamente");
      return;
    }

    const nodes = [];
    nodes.push({ key: "ROOT", name: "EMR TEAM", isTreeExpanded: false });
    nodes.push({
      key: leader.name,
      parent: "ROOT",
      name: leader.name,
      role: leader.role,
      isTreeExpanded: false
    });

    (children[leader.name] || []).forEach(sup => {
      const supObj = people.find(p => p.name === sup);
      nodes.push({
        key: sup,
        parent: leader.name,
        name: sup,
        role: supObj?.role || "",
        isTreeExpanded: false
      });

      (children[sup] || []).forEach(emp => {
        const empObj = people.find(p => p.name === emp);
        nodes.push({
          key: emp,
          parent: sup,
          name: emp,
          role: empObj?.role || ""
        });
      });
    });

    diagram.model = new go.TreeModel(nodes);
  }

  function find(arr, keys) {
    return arr.findIndex(h => keys.some(k => h.includes(k)));
  }
</script>

</body>
</html>
