<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>

  <!-- GoJS -->
  <script src="https://unpkg.com/gojs@2.3.17/release/go.js"></script>

  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <h1>Organigrama EMR</h1>
    <p>Haz clic en un supervisor para mostrar u ocultar su equipo</p>
  </header>

  <!-- ================== LIENZO ÚNICO ================== -->
  <div id="diagramWrapper">

    <!-- ===== EMR ===== -->
    <div id="diagramDiv"></div>

    <!-- ===== VENDORS (MISMO LIENZO) ===== -->
    <div id="vendorsContainer">
      <h2>Vendors</h2>
      <div id="vendorsDiv"></div>
    </div>

    <!-- ===== CONTROLES ===== -->
    <div class="controls" aria-label="Controles de vista">
      <button id="btnZoomIn" title="Zoom +">＋</button>
      <button id="btnZoomOut" title="Zoom −">－</button>
      <button id="btnFit" title="Ajustar a pantalla">⤢</button>
      <button id="btnFull" title="Pantalla completa">⛶</button>
    </div>

  </div>
  <!-- ================== FIN LIENZO ================== -->

  <!-- EMR (intocable) -->
  <script src="script.js"></script>

  <!-- Vendors (separado) -->
  <script src="script-vendors.js"></script>
</body>
</html>
