<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

<h1>Organigrama EMR</h1>
<div id="chart-container" style="width:100%; height: calc(100vh - 80px);"></div>

<script type="module">
  import * as d3 from "https://esm.sh/d3@7";
  import { OrgChart } from "https://esm.sh/d3-org-chart@3";

  fetch("./team.csv")
    .then(r => r.text())
    .then(text => d3.csvParse(text))
    .then(data => initChart(data));

  function initChart(data) {

    /* ============================
       1. Detectar columnas
       ============================ */
    const headers = Object.keys(data[0]).map(h => h.toLowerCase());
    const col = {
      first: find(headers, ["first", "nombre"]),
      last: find(headers, ["last", "apellido"]),
      role: find(headers, ["position", "cargo", "role"]),
      supervisor: find(headers, ["supervisor", "manager", "reports"]),
      image: find(headers, ["image", "photo", "picture"])
    };

    const ROOT_ID = "__ROOT__";

    /* ============================
       2. Crear nodos BASE
       TODOS cuelgan del ROOT
       ============================ */
    const nodes = data.map((d, i) => {
      const name = `${d[col.first] || ""} ${d[col.last] || ""}`.trim();
      return {
        id: `node-${i}`,
        parentId: ROOT_ID,          // 🔒 clave: nadie queda sin padre
        name,
        role: d[col.role] || "",
        supervisorName: (d[col.supervisor] || "").trim(),
        image: d[col.image] || ""
      };
    });

    const byName = new Map(nodes.map(n => [n.name.toLowerCase(), n]));

    /* ============================
       3. Resolver jerarquía REAL
       personal → supervisor
       ============================ */
    nodes.forEach(n => {
      if (!n.supervisorName) return;
      const sup = byName.get(n.supervisorName.toLowerCase());
      if (sup && sup.id !== n.id) {
        n.parentId = sup.id;
      }
    });

    /* ============================
       4. Insertar ROOT ÚNICO
       ============================ */
    nodes.push({
      id: ROOT_ID,
      parentId: null,              // 🔴 el ÚNICO null
      name: "EMR TEAM",
      role: "",
      image: ""
    });

    /* ============================
       5. Seguridad final
       (debug, pero no rompe)
       ============================ */
    const roots = nodes.filter(n => n.parentId === null);
    if (roots.length !== 1) {
      console.error("Roots detectados:", roots);
      throw new Error("Estructura inválida: multiple roots");
    }

    /* ============================
       6. Render OrgChart
       ============================ */
    const chart = new OrgChart()
      .container("#chart-container")
      .data(nodes)
      .nodeWidth(() => 190)
      .nodeHeight(() => 120)
      .childrenMargin(() => 40)
      .nodeContent(d => `
        <div class="org-card">
          ${
            d.data.image
              ? `<img src="${d.data.image}" />`
              : `<div style="width:44px;height:44px;border-radius:50%;background:#cbd5e1;margin:0 auto 6px"></div>`
          }
          <div class="org-name">${d.data.name}</div>
          <div class="org-role">${d.data.role}</div>
        </div>
      `);

    chart.render();
    chart.collapseAll();
    chart.expand(ROOT_ID);
  }

  function find(headers, keys) {
    return headers.find(h => keys.some(k => h.includes(k))) || "";
  }
</script>

</body>
</html>
