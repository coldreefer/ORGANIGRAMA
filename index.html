<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Organigrama EMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- GoJS -->
  <script src="https://unpkg.com/gojs/release/go.js"></script>

  <!-- PapaParse (CSV real) -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f6f8fb;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      color: #0f172a;
    }
    #myDiagramDiv {
      width: 100%;
      height: calc(100vh - 80px);
    }
  </style>
</head>

<body>

<h1>Organigrama EMR</h1>
<div id="myDiagramDiv"></div>

<script>
  const $ = go.GraphObject.make;

  const diagram = $(go.Diagram, "myDiagramDiv", {
    initialContentAlignment: go.Spot.Center,
    layout: $(go.TreeLayout, {
      angle: 90,
      arrangement: go.TreeLayout.ArrangementHorizontal,
      nodeSpacing: 30,
      layerSpacing: 40
    })
  });

  diagram.nodeTemplate =
    $(go.Node, "Vertical",
      {
        click: (e, node) => {
          diagram.model.setDataProperty(
            node.data,
            "isTreeExpanded",
            !node.isTreeExpanded
          );
        }
      },
      $(go.Panel, "Auto",
        $(go.Shape, "RoundedRectangle",
          { fill: "white", stroke: "#e5e7eb" }
        ),
        $(go.Panel, "Vertical",
          { margin: 10 },
          $(go.Picture,
            {
              width: 48,
              height: 48,
              margin: 6,
              background: "#cbd5e1"
            },
            new go.Binding("source", "image")
          ),
          $(go.TextBlock,
            { font: "bold 13px sans-serif" },
            new go.Binding("text", "name")
          ),
          $(go.TextBlock,
            { font: "12px sans-serif", stroke: "#475569" },
            new go.Binding("text", "role")
          )
        )
      )
    );

  diagram.linkTemplate =
    $(go.Link,
      { routing: go.Link.Orthogonal, corner: 6 },
      $(go.Shape, { stroke: "#cbd5e1" })
    );

  // === CARGA CSV REAL ===
  Papa.parse("team.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function (res) {
      buildModel(res.data);
    }
  });

  function buildModel(people) {

    // normalizar
    people = people.filter(p => p.Name);

    const children = {};
    people.forEach(p => {
      const sup = p.Supervisor || "";
      if (!children[sup]) children[sup] = [];
      children[sup].push(p.Name);
    });

    // detectar Team Leader real (tiene supervisores con gente)
    const leader = people.find(p =>
      (children[p.Name] || []).some(
        c => (children[c] || []).length > 0
      )
    );

    if (!leader) {
      alert("No se pudo detectar Team Leader");
      return;
    }

    const nodes = [];
    nodes.push({ key: "ROOT", name: "EMR TEAM", isTreeExpanded: false });

    nodes.push({
      key: leader.Name,
      parent: "ROOT",
      name: leader.Name,
      role: leader.Role,
      image: leader.Image,
      isTreeExpanded: false
    });

    (children[leader.Name] || []).forEach(sup => {
      const s = people.find(p => p.Name === sup);
      nodes.push({
        key: sup,
        parent: leader.Name,
        name: sup,
        role: s.Role,
        image: s.Image,
        isTreeExpanded: false
      });

      (children[sup] || []).forEach(emp => {
        const e = people.find(p => p.Name === emp);
        nodes.push({
          key: emp,
          parent: sup,
          name: emp,
          role: e.Role,
          image: e.Image
        });
      });
    });

    diagram.model = new go.TreeModel(nodes);
  }
</script>

</body>
</html>
