<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>

  <!-- GoJS -->
  <script src="https://unpkg.com/gojs@2.3.17/release/go.js"></script>

  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <h1>Organigrama EMR</h1>
  <p>Desplázate horizontalmente para ver Vendors</p>
</header>

<div id="diagramWrapper">

  <div id="diagramScroller">

    <!-- EMR -->
    <section class="diagramBlock emr">
      <div id="diagramDiv"></div>
    </section>

    <!-- VENDORS -->
    <section class="diagramBlock vendors">
      <h2>Vendors</h2>
      <div id="vendorsDiv"></div>
    </section>

  </div>

  <!-- CONTROLES -->
  <div class="controls">
    <button id="btnZoomIn" title="Zoom +">＋</button>
    <button id="btnZoomOut" title="Zoom −">－</button>
    <button id="btnFit" title="Ajustar">⤢</button>
    <button id="btnFull" title="Pantalla completa">⛶</button>
  </div>

</div>

<script src="script.js"></script>
<script src="script-vendors.js"></script>
<script src="pan.js"></script>

</body>
</html>
