<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

<h1>Organigrama EMR</h1>
<div id="chart-container" style="width:100%; height: calc(100vh - 80px);"></div>

<script type="module">
  import * as d3 from "https://esm.sh/d3@7";
  import { OrgChart } from "https://esm.sh/d3-org-chart@3";

  fetch("./team.csv")
    .then(r => r.text())
    .then(text => d3.csvParse(text))
    .then(data => initChart(data));

  function initChart(data) {

    const headers = Object.keys(data[0]).map(h => h.toLowerCase());
    const col = {
      first: find(headers, ["first", "nombre"]),
      last: find(headers, ["last", "apellido"]),
      role: find(headers, ["position", "cargo", "role"]),
      supervisor: find(headers, ["supervisor", "manager", "reports"]),
      image: find(headers, ["image", "photo", "picture"])
    };

    const ROOT_ID = "__ROOT__";

    // 1️⃣ Crear nodos base
    const nodes = data.map((d, i) => {
      const name = `${d[col.first] || ""} ${d[col.last] || ""}`.trim();
      return {
        id: `node-${i}`,
        parentId: ROOT_ID,
        name,
        role: d[col.role] || "",
        supervisorName: (d[col.supervisor] || "").trim(),
        image: d[col.image] || ""
      };
    });

    // 2️⃣ Resolver supervisores por nombre
    const byName = new Map(nodes.map(n => [n.name.toLowerCase(), n]));

    nodes.forEach(n => {
      const parent = byName.get(n.supervisorName.toLowerCase());
      if (parent && parent.id !== n.id) {
        n.parentId = parent.id;
      }
    });

    // 3️⃣ Detectar y romper ciclos
    const visited = new Set();
    const stack = new Set();

    function visit(node) {
      if (stack.has(node.id)) {
        // 🔴 ciclo detectado → romper
        node.parentId = ROOT_ID;
        return;
      }
      if (visited.has(node.id)) return;

      visited.add(node.id);
      stack.add(node.id);

      const parent = nodes.find(n => n.id === node.parentId);
      if (parent) visit(parent);

      stack.delete(node.id);
    }

    nodes.forEach(n => visit(n));

    // 4️⃣ Insertar ROOT ÚNICO
    nodes.push({
      id: ROOT_ID,
      parentId: null,
      name: "EMR TEAM",
      role: "",
      image: ""
    });

    // 5️⃣ Render
    const chart = new OrgChart()
      .container("#chart-container")
      .data(nodes)
      .nodeWidth(() => 190)
      .nodeHeight(() => 120)
      .childrenMargin(() => 40)
      .nodeContent(d => `
        <div class="org-card">
          ${d.data.image
            ? `<img src="${d.data.image}" />`
            : `<div style="width:44px;height:44px;border-radius:50%;background:#cbd5e1;margin:0 auto 6px"></div>`
          }
          <div class="org-name">${d.data.name}</div>
          <div class="org-role">${d.data.role}</div>
        </div>
      `);

    chart.render();
  }

  function find(headers, keys) {
    return headers.find(h => keys.some(k => h.includes(k))) || "";
  }
</script>

</body>
</html>
