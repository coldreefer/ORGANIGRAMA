<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>

  <!-- GoJS -->
  <script src="https://unpkg.com/gojs@2.3.17/release/go.js"></script>

  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <h1>Organigrama EMR</h1>
  <p>Desplázate horizontalmente para ver Vendors</p>
</header>

<!-- ================== LIENZO ÚNICO HORIZONTAL ================== -->
<div id="diagramWrapper">

  <div id="diagramScroller">

    <!-- ===== EMR ===== -->
    <section class="diagramBlock">
      <div id="diagramDiv"></div>
    </section>

    <!-- ===== VENDORS ===== -->
    <section class="diagramBlock vendors">
      <h2>Vendors</h2>
      <div id="vendorsDiv"></div>
    </section>

  </div>

  <!-- ===== CONTROLES ===== -->
  <div class="controls">
    <button id="btnZoomIn">＋</button>
    <button id="btnZoomOut">－</button>
    <button id="btnFit">⤢</button>
    <button id="btnFull">⛶</button>
  </div>

</div>
<!-- ================== FIN LIENZO ================== -->

<script src="script.js"></script>
<script src="script-vendors.js"></script>

</body>
</html>
