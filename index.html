<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Organigrama EMR</title>

  <!-- GoJS -->
  <script src="https://unpkg.com/gojs@2.3.17/release/go.js"></script>

  <!-- PapaParse -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <h1>Organigrama EMR</h1>
  <p>Arrastra con el mouse y usa zoom (un solo lienzo)</p>
</header>

<!-- ================= LIENZO ÚNICO ================= -->
<div id="diagramWrapper">

  <!-- GOJS CANVAS -->
  <div id="diagramDiv"></div>

  <!-- ================= CONTROLES ================= -->
  <div class="controls">
    <button id="btnZoomIn" title="Zoom +">＋</button>
    <button id="btnZoomOut" title="Zoom -">－</button>
    <button id="btnFit" title="Ajustar">⤢</button>
    <button id="btnFull" title="Pantalla completa">⛶</button>
  </div>

</div>

<!-- Script principal -->
<script src="script.js"></script>

</body>
</html>
